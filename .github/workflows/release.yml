# Builds the Windows installer, the Linux packages and the macOS app, smoke-tests Linux and macOS, and attaches
# everything to a *draft* GitHub release. Publish the draft when it looks right; installed
# copies of PyroCade only see published releases.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Smoke test shared by the Linux and macOS jobs: the app loads and lists every catalog emulator.
  SMOKE_JS: (async()=>JSON.stringify({version:await api.appVersion(),emulators:(await api.emuList()).filter(e=>e.managed).length,demo:!document.getElementById('demoBanner').classList.contains('hidden')}))()
  SMOKE_EMULATORS: '"emulators":11'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/PyroCade-Setup-*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # rpm builds the Fedora package, libarchive-tools the Arch one; xvfb runs the smoke test.
      - run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools xvfb
      - run: npm ci
      - run: npx electron-builder --linux AppImage deb rpm pacman --publish never
      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          PYROCADE_SNAP: ${{ runner.temp }}/appimage.png
          PYROCADE_JS: ${{ env.SMOKE_JS }}
        run: |
          chmod +x dist/PyroCade-*.AppImage
          timeout 120 xvfb-run -a dist/PyroCade-*.AppImage --no-sandbox
          cat "$PYROCADE_SNAP.txt"; echo
          test -s "$PYROCADE_SNAP"
          grep -q "$SMOKE_EMULATORS" "$PYROCADE_SNAP.txt"
      - name: Smoke test the .deb
        env:
          PYROCADE_SNAP: ${{ runner.temp }}/deb.png
        run: |
          sudo apt-get install -y ./dist/pyrocade_*_amd64.deb
          timeout 120 xvfb-run -a pyrocade --no-sandbox
          test -s "$PYROCADE_SNAP"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/PyroCade-*.AppImage
            dist/pyrocade_*.deb
            dist/pyrocade-*.rpm
            dist/pyrocade-*.pkg.tar.zst
            ${{ runner.temp }}/*.png
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Universal build (Apple Silicon + Intel), ad-hoc signed: not notarized by Apple.
      - run: npx electron-builder --mac --publish never
      - name: Check the app signature
        run: codesign --verify --deep --strict dist/mac-universal/PyroCade.app
      - name: Smoke test the app
        timeout-minutes: 3
        env:
          PYROCADE_SNAP: ${{ runner.temp }}/mac.png
          PYROCADE_JS: ${{ env.SMOKE_JS }}
        run: |
          dist/mac-universal/PyroCade.app/Contents/MacOS/PyroCade
          cat "$PYROCADE_SNAP.txt"; echo
          test -s "$PYROCADE_SNAP"
          grep -q "$SMOKE_EMULATORS" "$PYROCADE_SNAP.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/PyroCade-*-mac-universal.dmg
            dist/PyroCade-*-mac-universal.zip
            ${{ runner.temp }}/*.png
          if-no-files-found: error

  release:
    needs: [windows, linux, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=$(find out -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.dmg' -o -name '*-mac-universal.zip' \))
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --draft --title "PyroCade ${TAG#v}" --generate-notes
          fi
